<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- QSMS Quality Gradient (Cyan to Emerald) -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Rework Loop Gradient (SFC Amber to QSMS Emerald) -->
    <linearGradient id="reworkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <g filter="url(#subtleGlow)">
    <!-- Outer Rework Loop Arrow (Representing Rework Cycle in Shop Floor Control) -->
    <path 
      d="M 256 70 A 186 186 0 1 1 96 162" 
      fill="none" 
      stroke="url(#reworkGrad)" 
      stroke-width="28" 
      stroke-linecap="round" 
    />
    <!-- Arrowhead pointing forward on the rework cycle -->
    <path 
      d="M 96 112 L 84 175 L 148 175 Z" 
      fill="#F59E0B" 
    />

    <!-- Inner Central "Q" of QSMS with Quality Checkmark Tail -->
    <!-- Circle of the "Q" -->
    <circle 
      cx="256" 
      cy="256" 
      r="104" 
      fill="none" 
      stroke="url(#qGrad)" 
      stroke-width="26" 
      stroke-dasharray="520 130"
      stroke-dashoffset="65"
    />

    <!-- Precision Quality Checkmark forming the Q's Tail (Inspected & Verified by QSMS) -->
    <path 
      d="M 210 265 L 260 315 L 375 195" 
      fill="none" 
      stroke="#10B981" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Subtle Minimal Branding Label -->
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    fill="#94A3B8" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="800" 
    letter-spacing="6"
  >
    QSMS · SFC
  </text>
</svg>
